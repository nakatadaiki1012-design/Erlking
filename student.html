<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔王｜生徒用</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="student">
<div class="app">
  <header class="top">
    <div class="brand"><b>魔王</b><small>シューベルト</small></div>
    <nav class="tabs">
      <button class="tab" data-v="guide">ガイド</button>
      <button class="tab" data-v="listen">聴く</button>
      <button class="tab" data-v="compare">くらべる</button>
      <button class="tab" data-v="quiz">クイズ</button>
    </nav>
    <div class="tools">
      <button class="btn s-names listen-only">名前をかくす</button>
      <button class="btn s-keysbtn listen-only" >鍵盤</button>
      <button class="btn s-lyrics listen-only">歌詞：日本語</button>
      <button class="btn guide-only s-words">ことば</button>
      <button class="btn guide-only s-sheet">鑑賞シート</button>
      <button class="btn icon s-info" aria-label="このアプリについて">ⓘ</button>
    </div>
  </header>
  <main></main>
</div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/notes.js"></script>
<script src="js/keys.js"></script>
<script src="js/views.js"></script>
<script src="js/student.js"></script>
</body>
</html>
