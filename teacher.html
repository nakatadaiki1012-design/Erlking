<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔王｜先生用</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="teacher">
<div class="app">
  <header class="top">
    <div class="brand"><b>魔王</b><small>シューベルト</small><span class="who-tag">先生用</span></div>
    <nav class="tabs">
      <button class="tab" data-v="listen">聴く</button>
      <button class="tab" data-v="compare">くらべる</button>
      <button class="tab" data-v="quiz">クイズ</button>
    </nav>
    <div class="tools">
      <button class="btn t-names listen-only" title="H キー">名前をかくす</button>
      <button class="btn t-lyrics listen-only" title="L キー">歌詞：日本語</button>
      <button class="btn icon t-settings" title="設定" aria-label="設定">⚙</button>
      <button class="btn icon t-full" title="全画面（F キー）" aria-label="全画面">⛶</button>
    </div>
  </header>
  <main></main>
</div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
